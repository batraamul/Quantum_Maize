[package]
name = "quantum-maze"
version = "0.5.0"
description = "Quantum Maze – Research & LaTeX Studio"
authors = ["Quantum Maze contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "qmaze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
include_dir = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
