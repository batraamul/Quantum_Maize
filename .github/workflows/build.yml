# Builds and tests Quantum Maze on native runners. One OS cannot produce the
# other platforms' installers, so each target has its own job.
# Pushing a tag such as v0.2.0 also publishes the installers as a GitHub Release.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-22.04, args: "--bundles deb,rpm,appimage" }
          - { name: windows, os: windows-latest, args: "--bundles nsis,msi" }
          # One universal build runs natively on both Apple Silicon and Intel Macs.
          - { name: macos, os: macos-latest, args: "--target universal-apple-darwin --bundles app,dmg", rust_target: "aarch64-apple-darwin,x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.rust_target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm file \
            texlive-latex-extra texlive-xetex texlive-luatex texlive-bibtex-extra texlive-publishers \
            biber latexmk pandoc
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # Integration tests skip themselves where TeX/Pandoc are not installed.
      # Test failures on Windows/macOS are reported but do not stop the installers
      # being built, because those platforms have not been tested yet.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        continue-on-error: ${{ runner.os != 'Linux' }}
      # macOS signing: with the APPLE_* secrets set, the app is signed (and notarized when
      # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID are set too). Without them it is ad-hoc signed,
      # which Apple Silicon requires for the app to start at all.
      - name: macOS signing setup
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                { echo "$v<<EOF_SECRET"; echo "${!v}"; echo "EOF_SECRET"; } >> "$GITHUB_ENV"
              fi
            done
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - name: Build installers
        run: npx tauri build ${{ matrix.args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-maze-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          name: Quantum Maze ${{ github.ref_name }}
          body: |
            Unsigned builds (macOS: ad-hoc signed). Windows SmartScreen and macOS Gatekeeper will warn on first launch — see README "Install".
            A TeX distribution (TeX Live, MacTeX or MiKTeX) must be installed separately. Pandoc is optional (Word conversion).
          files: artifacts/**/*
